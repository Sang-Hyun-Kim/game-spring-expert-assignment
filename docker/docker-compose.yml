name: webcraft

# Lv 20 앱 서버 공통 설정. x- 최상위 키는 서비스가 아니라 확장 필드다.
# 앵커로 묶어 두 앱이 같은 이미지·같은 설정을 쓰도록 강제한다(엔진 버전 혼용 금지).
x-app-common: &app-common
  build:
    context: ..            # compose 파일 위치 기준. 저장소 루트가 ..
    dockerfile: Dockerfile
  image: game-expert:lv20
  environment:
    # 환경변수가 application.properties 를 덮는다(relaxed binding).
    # 컨테이너 안 localhost 는 자기 자신이므로 서비스 이름으로 부르고, 내부 포트를 쓴다.
    SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-webcraft}
    SPRING_DATASOURCE_USERNAME: root
    SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?docker/.env 에 MYSQL_ROOT_PASSWORD 를 설정하세요}
    SPRING_DATA_REDIS_HOST: redis
    SPRING_DATA_REDIS_PORT: 6379
    TZ: Asia/Seoul         # 기본값 UTC 로 두면 @CreationTimestamp 가 9시간 밀린다
  healthcheck:
    # actuator 가 없으므로 실제 엔드포인트를 친다. 여기 localhost 는 자기 앱이 맞다.
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/worlds"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 40s      # 기동 실측 10.3초
  # Dockerfile 의 MaxRAMPercentage 와 한 쌍. 없으면 JVM 이 Docker VM 전체를 기준으로
  # 힙을 잡아 MySQL 을 굶긴다 -> lease 타임아웃 -> WORLD_AUTHORITY_RETIRED.
  mem_limit: 1536m
  restart: unless-stopped

services:
  mysql:
    image: mysql:8.0
    container_name: webcraft-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-webcraft}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?docker/.env 에 MYSQL_ROOT_PASSWORD 를 설정하세요}
    ports:
      - "${MYSQL_HOST_PORT:-3309}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    # PC 재부팅 후에도 자동 기동. 단, 사용자가 stop 한 경우는 그대로 둔다.
    restart: unless-stopped
    # lvl 1에 대한 피드백
    # 초기화 중에 애플리케이션이 붙으면 Communications link failure 로 실패한다.
    # docker compose ps 의 STATUS 가 healthy 가 된 뒤에 bootRun 한다.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.0-alpine
    container_name: webcraft-redis
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379" #6379는 다른 프로젝트가 사용중
    volumes:
      - redis_data:/data
    restart: unless-stopped
    # 위의 mysql 설명과 동일
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Lv 20: 앱 2대. 같은 이미지, 같은 MySQL/Redis, 다른 외부 포트.
  app1:
    <<: *app-common
    container_name: webcraft-app1   # 두 앱에 같은 이름을 주면 기동 실패
    ports:
      - "${APP1_HOST_PORT:-18080}:8080"   # 8080 은 과제 1 과 충돌
    depends_on:
      # service_healthy 라야 초기화 완료를 기다린다. started 만으로는 부족하다.
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  app2:
    <<: *app-common
    container_name: webcraft-app2
    ports:
      - "${APP2_HOST_PORT:-18081}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      app1:
        condition: service_healthy   # ddl-auto=update 동시 기동 충돌 방지

volumes:
  mysql_data:
  redis_data:
